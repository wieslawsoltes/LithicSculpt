name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore verified source archive
        id: source
        if: hashFiles('package.json') == '' && github.event_name != 'pull_request'
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, os, tarfile
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('.bootstrap').glob('source-*.b64'))
          if len(parts) != 8:
              raise SystemExit('Expected exactly eight source archive segments')
          data = b''.join(base64.b64decode(p.read_bytes(), validate=True) for p in parts)
          expected = '34eac59caf4d624f754ca2824a72d937cfccfe83818801e39d54340ae86feed6'
          if len(data) != 64916 or hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Source archive checksum mismatch')
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              members = archive.getmembers()
              if len(members) != 26 or sum(m.size for m in members) > 5_000_000:
                  raise SystemExit('Unexpected archive contents')
              for member in members:
                  path = PurePosixPath(member.name)
                  if (not member.isfile() or path.is_absolute() or not path.parts
                          or '..' in path.parts or path.parts[0] in {'.git', '.github', '.bootstrap'}
                          or member.size > 1_000_000):
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              for member in members:
                  path = Path(member.name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(member) as stream:
                      path.write_bytes(stream.read())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('restored=true\n')
          print('Restored 26 source files; SHA-256 verified')
          PY
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run core tests
        run: npm test
      - name: Build browser distributions
        run: npm run build:pages
      - name: Commit expanded and verified source
        if: steps.source.outputs.restored == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .bootstrap
          git add --all
          git commit -m 'feat: add Lithic Sculpt engine, workspace, tests and Pages build'
          git push origin HEAD:main
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
