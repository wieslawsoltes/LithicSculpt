name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run core tests
        run: npm test
      - name: Build browser distributions
        run: |
          npm run build:pages
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('_site/build-info.json', JSON.stringify({commit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID}) + '\n');"
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify live deployment and browser assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          commit = os.environ['GITHUB_SHA']
          def read(path):
              request = urllib.request.Request(base + path + '?build=' + commit,
                  headers={'Cache-Control': 'no-cache', 'User-Agent': 'LithicSculpt-Pages-Check'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{path}: HTTP {response.status}')
                  return response.read()
          for attempt in range(12):
              try:
                  deployed = json.loads(read('build-info.json'))
                  if deployed['commit'] != commit:
                      raise RuntimeError('Pages is still serving a previous commit')
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          assets = ['', 'style.css', 'src/app.js', 'src/render.js', 'src/sculpt.js',
                    'src/mesh.js', 'src/math.js', 'src/io.js', 'src/model.js',
                    'src/topology.js', 'src/worker.js', 'dist/lithic-sculpt.html',
                    'tests/gpu-smoke.html', 'tests/gpu-smoke.js']
          for path in assets:
              content = read(path)
              if not content:
                  raise RuntimeError(f'Empty deployed asset: {path}')
              if path in {'', 'dist/lithic-sculpt.html'} and b'<title>Lithic Sculpt' not in content:
                  raise RuntimeError(f'Unexpected application HTML: {path}')
              print(f'HTTP 200: {path or "index.html"} ({len(content)} bytes)')
          print(f'Verified deployment of {commit}: {base}')
          PY
